<p-button label="Edit or Add" (onClick)="updateCultivationCropsData()" />
<p-table [value]="cultivationCropsData" class="tab-data-table">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="firstName" class="text-center">
        Sc No <p-sortIcon field="firstName" />
      </th>

      <th pSortableColumn="address" class="text-center">
        Cultivatable Products <p-sortIcon field="address" />
      </th>
      <th pSortableColumn="address" class="text-center">
        Rabi/Karif <p-sortIcon field="address" />
      </th>
      <th pSortableColumn="Amount" class="text-right">
        Area in Acrs <p-sortIcon field="Amount" />
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-cultivationData>
    <tr>
      <td class="text-center">
        {{ cultivationData.id }}
      </td>

      <td class="text-right">
        {{ villagelookupsData.cultivationCrops[cultivationData.id].name }}
      </td>

      <td class="text-right">
        {{ cultivationData.seasonName }}
      </td>

      <td class="text-right">
        {{ cultivationData.totalAcrs }}
      </td>
    </tr>
  </ng-template>
</p-table>

<p-sidebar
  [(visible)]="cultivationDataVisible"
  position="right"
  [showCloseIcon]="false"
>
  <form [formGroup]="cultivationDataForm" *ngIf="cultivationDataVisible">
    <div class="tab-pop-txt">
      <h4>Add Land Utilization</h4>
      <i class="pi pi-times" (click)="cultivationDataVisible = false"></i>
    </div>

    <div class="pop-data-set">
      <div class="project-detail-set mt-4">
        <div class="project-detail-set-h">Community</div>
        <div class="project-detail-set-v mt-2">
          <p-dropdown
            [options]="CommunityOptions"
            FormControlName="community"
            optionLabel="name"
            optionValue="id"
            placeholder="Select Community"
          />
        </div>
      </div>

      <div class="project-detail-set mt-4">
        <div class="project-detail-set-h">Government</div>
        <div class="project-detail-set-v mt-2">
          <p-inputNumber
            mode="decimal"
            FormControlName="government"
            #communityFemale
          />
        </div>
      </div>

      <div class="project-detail-set mt-4">
        <div class="project-detail-set-h">Private</div>
        <div class="project-detail-set-v mt-2">
          <p-inputNumber
            inputId="private"
            FormControlName="private"
            #communityMale
          />
        </div>
      </div>

      <div class="project-detail-set mt-4">
        <div class="project-detail-set-h">Self empolyment</div>
        <div class="project-detail-set-v mt-2">
          <p-inputNumber
            inputId="SelfEmpolyment"
            FormControlName="SelfEmpolyment"
            #communityMale
          />
        </div>
      </div>

      <div class="project-detail-set mt-4">
        <div class="project-detail-set-h">Total</div>
        <div class="project-detail-set-v mt-2">11111111</div>
      </div>
    </div>

    <div class="tab-footer-btns">
      <p-button label="Cancel " (click)="(false)" class="cancel-btn" />
      <p-button label="Add " type="submit" class="submit-btn" />
    </div>
  </form>
</p-sidebar>
