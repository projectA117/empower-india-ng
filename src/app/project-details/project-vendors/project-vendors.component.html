
<div class="row mb-4">
<div class="project-detail-h-set tab-h-txt">
  <h4>Vendor Details</h4>
  <p-button label="Add Vendor" (click)="vendorSidebarVisible = true" />
</div>





<div class="justify-content-start flex-wrap mt-15">
  <p-table
    [value]="VendorsDetails"
    class="tab-data-table"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="Vendor">
          Vendor Name <p-sortIcon field="Vendor" />
        </th>
        <th pSortableColumn="Contractor">
          Contractor Name <p-sortIcon field="Contractor" />
        </th>

        <th pSortableColumn="Phone">Phone <p-sortIcon field="Phone" /></th>
        <th pSortableColumn="Address">
          Address <p-sortIcon field="Address" />
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-VendorsDetails>
      <tr>
        <td>{{ VendorsDetails.code }}</td>
        <td>{{ VendorsDetails.name }}</td>
        <td>{{ VendorsDetails.category }}</td>
        <td>{{ VendorsDetails.code }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
</div>


<p-sidebar
  [(visible)]="vendorSidebarVisible"
  position="right"
  [showCloseIcon]="false"
>
  <form
    [formGroup]="VendorForm"
    *ngIf="vendorSidebarVisible"
    (ngSubmit)="updateVendor()"
  >

  <div class="tab-pop-txt">
    <h4>Add Vendor</h4>
    <i class="pi pi-times" (click)="vendorSidebarVisible = false"></i>
  </div>

  <div class="pop-data-set">

    <div class="project-detail-set mt-4">
      <div class="project-detail-set-h">Vendor Name</div>
      <div class="project-detail-set-v mt-2">
        <input
        pInputText
        id="VendorName"
        formControlName="VendorName"
        aria-describedby="VendorName"
      />
      </div>
    </div>

    <div class="project-detail-set mt-4">
      <div class="project-detail-set-h">Contractor Name</div>
      <div class="project-detail-set-v mt-2">
        <input
        pInputText
        id="VendorContractorName"
        aria-describedby="VendorContractorName"
        formControlName="VendorContractorName"
      />
      </div>
    </div>
   
    <div class="project-detail-set mt-4">
      <div class="project-detail-set-h">Mobile</div>
      <div class="project-detail-set-v mt-2">
        <input
        pInputText
        id="VendorMobile"
        aria-describedby="VendorMobile"
        formControlName="VendorMobile"
      />
      </div>
    </div>

    <div class="project-detail-set mt-4">
      <div class="project-detail-set-h">Address</div>
      <div class="project-detail-set-v mt-2">
        <textarea
          pInputTextarea
          id="VendorAddress"
          aria-describedby="VendorAddress"
          formControlName="VendorAddress"
          rows="5"
          cols="30"
          id="Address"
        ></textarea>
      </div>
    </div>

  </div>

    <div class="tab-footer-btns">
      <p-button
        label="Cancel "
        (click)="vendorSidebarVisible = false"
        class="cancel-btn"
      />
      <p-button label="Add " type="submit" class="submit-btn" />
    </div>

    
  </form>
</p-sidebar>
