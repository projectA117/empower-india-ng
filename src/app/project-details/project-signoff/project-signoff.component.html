<div class="row mb-4">
  <div class="bottom-table-head">
    <h4>Project Sign Off Details</h4>
    @if (localStorageuser()) {
    <div class="flex gap-2">
      <p-button
        label="Completed"
        *appHasRole="[3, 4]"
        (click)="completeProject()"
        [disabled]="products && products.length < 2"
      >
      </p-button>
      <p-button
        label="Add Sign Off Details"
        (click)="addProjectSignOff()"
        *appHasRole="[3, 4]"
      />
    </div>
    }
  </div>

  <div class="justify-content-start flex-wrap mt-15">
    <p-table [value]="products" class="tab-data-table">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="Vendor">Name</th>
          <th pSortableColumn="Contractor">Email</th>

          <th pSortableColumn="Auditor">Phone</th>
          <th pSortableColumn="Decription">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-product>
        <tr>
          <td>{{ product.firstName }} {{ product.lastName }}</td>
          <td>{{ product.email }}</td>
          <td>{{ product.phoneNumber }}</td>
          <td>
            @if (localStorageuser()) {
            <div class="d-flex gap-3 action-btns">
              <img
                src="assets/images/icon-edit.svg"
                (click)="editProjectSignOff(product)"
                *appHasRole="[4, 3]"
              />
              <img
                src="assets/images/icon-delete.svg"
                (click)="deleteProjectSignOff(product.id)"
                *appHasRole="[4, 3]"
              />
            </div>
            }
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-sidebar
  [(visible)]="ProjectSignOffsidebarVisible"
  position="right"
  [showCloseIcon]="false"
>
  <form
    [formGroup]="ProjectSignOffForm"
    *ngIf="ProjectSignOffsidebarVisible"
    (ngSubmit)="onProjectSignOffSubmit()"
  >
    <div class="tab-pop-txt">
      <h4>Signoff Member</h4>
      <i class="pi pi-times" (click)="onCancel()"></i>
    </div>

    <div class="pop-data-set">
      <div class="project-detail-set mt-4">
        <div class="project-detail-set-h">First Name</div>
        <div class="project-detail-set-v mt-2">
          <input
            pInputText
            id="firstName"
            formControlName="firstName"
            aria-describedby="firstName"
          />
        </div>
      </div>

      <div class="project-detail-set mt-4">
        <div class="project-detail-set-h">Last Name</div>
        <div class="project-detail-set-v mt-2">
          <input
            pInputText
            id="lastName"
            formControlName="lastName"
            aria-describedby="lastName"
          />
        </div>
      </div>

      <div class="project-detail-set mt-4">
        <div class="project-detail-set-h">e-mail</div>
        <div class="project-detail-set-v mt-2">
          <input
            pInputText
            id="email"
            formControlName="email"
            aria-describedby="email"
          />
        </div>
      </div>

      <div class="project-detail-set mt-4">
        <div class="project-detail-set-h">Mobile</div>
        <div class="project-detail-set-v mt-2">
          <p-inputNumber
            id="Mobile"
            mode="decimal"
            formControlName="phoneNumber"
            inputId="withoutgrouping"
            [useGrouping]="false"
          />
        </div>
      </div>
    </div>

    <div class="tab-footer-btns">
      <p-button label="Cancel" (click)="onCancel()" class="cancel-btn" />
      <p-button
        [label]="editForm ? 'Update' : 'Add'"
        type="submit"
        class="submit-btn"
        [disabled]="!ProjectSignOffForm.valid"
      />
    </div>
  </form>
</p-sidebar>
