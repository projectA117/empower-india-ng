<div class="page-vertical1">
  <form [formGroup]="projectForm" (ngSubmit)="save()">
    <div class="basic-div-level1">
      <div class="basic-div-level2">
        <label for="district" class="formbuilder-select-label form-label">District</label>
        <p-dropdown id="district" [filter]="true" [options]="districts" formControlName="district"
          optionLabel="name" placeholder="Select a District" (onChange)="getMandals($event)" />
          <small class="p-error" *ngIf="submitted && projectForm.controls['district'].errors?.required">
            District is required.
          </small>
      </div>
      <div class="basic-div-level2">
        <label for="mandal" class="formbuilder-select-label form-label">Mandal</label>
        <p-dropdown id="mandal" [filter]="true" [options]="mandals" formControlName="mandal"
          optionLabel="name" placeholder="Select a Mandal" (onChange)="getvilages($event)" />
          <small class="p-error" *ngIf="submitted && projectForm.controls['mandal'].errors?.required">
            Mandal is required.
          </small>
      </div>
    </div>
    <div class="basic-div-level1">
      <div class="basic-div-level2">
        <label for="village" class="formbuilder-select-label form-label">Village</label>
        <p-dropdown id="village" [filter]="true" [options]="villages" formControlName="village"
          optionLabel="name" placeholder="Select a Village" />
          <small class="p-error" *ngIf="submitted && projectForm.controls['village'].errors?.required">
            Village is required.
          </small>
      </div>

      <div class="basic-div-level2">
        <label for="address" class="formbuilder-select-label form-label">Colony/Street/Location</label>
        <input id="address" type="text" pInputText formControlName="address" />
      </div>
    </div>

    <div class="basic-div-level1">
      <div class="basic-div-level2">
        <label for="latitude" class="formbuilder-select-label form-label">Latitude</label>
        <input id="latitude" type="text" pInputText formControlName="latitude" />
      </div>

      <div class="basic-div-level2">
        <label for="longitude" class="formbuilder-select-label form-label">Longitude</label>
        <input id="longitude" type="text" pInputText formControlName="longitude" />
      </div>
    </div>
    <div class="basic-div-level1">
      <div class="basic-div-level2">
        <label for="category" class="formbuilder-select-label form-label">Project Category</label>
        <p-dropdown id="projectCategory" [filter]="true" [options]="categories"
          formControlName="category" optionLabel="name" placeholder="Select Projects Category"
          (onChange)="getProjectNames($event)" />
          <small class="p-error" *ngIf="submitted && projectForm.controls['category'].errors?.required">
            Category is required.
          </small>
      </div>
      <div class="basic-div-level2">
        <label for="projectName" class="form-label">Project Name</label>
        <p-dropdown id="projectName" [filter]="true" [options]="projectNames"
          formControlName="name" optionLabel="description" placeholder="Select Projects Name" />
          <small class="p-error" *ngIf="submitted && projectForm.controls['name'].errors?.required">
            Name is required.
          </small>
      </div>
    </div>
    <div class="basic-div-level1">
      <div class="basic-div-level2 basic-div-level2-radio">
        <span class="project-type">Project Need: </span>
        <input  class="radio-button-style" type="radio" value="New" formControlName="projectType" />
        <label class="form-label project-type">New</label>
        <input class="radio-button-style" type="radio" value="Existing" formControlName="projectType" />
        <label class="form-label project-type">Existing</label>
      </div>
    </div>
    
    <div class="basic-div-level1">
      <div class="basic-div-level2-desc">
        <label for="description" class="form-label">Project Description</label>
        <textarea pInputTextarea formControlName="description" required rows="3" cols="20">
    </textarea>
      </div>
    </div>
    <div class="basic-div-level1">
      <div class="basic-div-level2">
        <label for="price" class="form-label">Project Estimation</label>
        <p-inputNumber id="price" formControlName="estimation" mode="currency" currency="USD"
          locale="en-US" />
      </div>

      <div class="basic-div-level2">
        <label for="price" class="form-label">Govt Share</label>
        <p-inputNumber id="price" formControlName="govtShare" mode="currency" currency="USD"
          locale="en-US" />
      </div>
    </div>

    <div class="basic-div-level1">
      <div class="basic-div-level2">
        <label for="price" class="form-label">Public Share</label>
        <p-inputNumber id="price" formControlName="publicShare" mode="currency" currency="USD"
          locale="en-US" />
      </div>
    </div>
    <div class="basic-div-level1 gap-3">
      <button pButton type="button" label="Cancel" class="p-button-success p-button-sm p-button-outlined"></button>
        <button pButton type="submit" label="Submit" class="p-button-success p-button-sm p-button-raised"></button>
   </div>  
  </form>
</div>
<div class="page-vertical2">
</div>
