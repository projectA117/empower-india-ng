<div class="main-container">
  <div class="header-set">
    <h3>Projects List</h3>
    <div class="header-set-filter">
      <p-dropdown
        [filter]="true"
        [options]="DistrictDetails"
        [(ngModel)]="selectedDistrict"
        optionLabel="name"
        placeholder="Select a District"
        (onChange)="getMandals($event)"
      />
      <p-dropdown
        [filter]="true"
        [options]="mandals"
        [(ngModel)]="selectMandals"
        optionLabel="name"
        placeholder="Select a Mandal"
        (onChange)="getvilages($event)"
      />
      <p-dropdown
        [filter]="true"
        [options]="vilage"
        [(ngModel)]="selectVilage"
        optionLabel="name"
        placeholder="Select a Vilage"
      />

      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          (input)="dt.filterGlobal($event.target.value, 'contains')"
          placeholder="Search..."
        />
      </span>
      <p-button label="Add New Project" (onClick)="openNew()" />
    </div>
  </div>

  <p-toast />
  <p-toolbar styleClass="mb-4 gap-2" style="width: 100">
    <ng-template pTemplate="left">
      <p-button
        severity="success"
        label="New"
        icon="pi pi-plus"
        class="mr-2"
        (onClick)="openNew()"
      />
      <p-button
        severity="danger"
        label="Delete"
        icon="pi pi-trash"
        (onClick)="deleteSelectedProducts()"
        [disabled]="!selectedProducts || !selectedProducts.length"
      />
    </ng-template>

    <ng-template pTemplate="right">
      <p-fileUpload
        mode="basic"
        accept="image/*"
        [maxFileSize]="1000000"
        label="Import"
        chooseLabel="Import"
        class="mr-2 inline-block"
      />
      <!-- <p-button severity="help" label="Export" icon="pi pi-upload" /> -->
    </ng-template>
  </p-toolbar>

  <p-table
    #dt
    [value]="products"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="[
      'name',
      'country.name',
      'representative.name',
      'status'
    ]"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selectedProducts"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showCurrentPageReport]="true"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem">
          <p-tableHeaderCheckbox />
        </th>
        <th>Image</th>

        <th pSortableColumn="name" style="min-width: 15rem">
          Location <p-sortIcon field="name" />
        </th>
        <th pSortableColumn="name" style="min-width: 15rem">
          Project Name <p-sortIcon field="name" />
        </th>
        <th pSortableColumn="price">Estimation <p-sortIcon field="price" /></th>
        <th pSortableColumn="category" style="min-width: 10rem">
          Category <p-sortIcon field="category" />
        </th>
        <th pSortableColumn="rating">Reviews <p-sortIcon field="rating" /></th>
        <th pSortableColumn="inventoryStatus" style="min-width: 10rem">
          Status <p-sortIcon field="inventoryStatus" />
        </th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>
          <p-tableCheckbox [value]="product" />
        </td>
        <td>
          <img
            [src]="
              'https://primefaces.org/cdn/primeng/images/demo/product/' +
              product.image
            "
            [alt]="product.name"
            width="50"
            class="shadow-4"
          />
        </td>
        <td>Location</td>
        <td>
          {{ product.name }}
        </td>

        <td>
          {{ product.price | currency : "USD" }}
        </td>
        <td>
          {{ product.category }}
        </td>
        <td>
          <p-rating
            [(ngModel)]="product.rating"
            [readonly]="true"
            [cancel]="false"
          />
        </td>
        <td>
          <p-tag
            [value]="product.inventoryStatus"
            [severity]="getSeverity(product.inventoryStatus)"
          />
        </td>
        <td>
          <p-button
            icon="pi pi-pencil"
            class="mr-2"
            [rounded]="true"
            [outlined]="true"
            severity="success"
            (onClick)="editProduct(product)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [rounded]="true"
            [outlined]="true"
            (onClick)="deleteProduct(product)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [(visible)]="productDialog"
    [style]="{ width: '450px' }"
    header="Add Project"
    [modal]="true"
    styleClass="p-fluid"
  >
    <ng-template pTemplate="content">
      <img
        [src]="
          'https://primefaces.org/cdn/primeng/images/demo/product/' +
          product.image
        "
        [alt]="product.image"
        class="block m-auto pb-3"
        *ngIf="product.image"
      />

      <form
        [formGroup]="newProjectForm"
        (ngSubmit)="savenewProjectForm()"
        class="php-email-form"
      >
        <div class="rendered-form">
          <div class="formbuilder-select form-group field-select-1738515105639">
            <label for="select-1738515105639" class="formbuilder-select-label"
              >District</label
            >
            <p-dropdown
              [filter]="true"
              [options]="DistrictDetails"
              formControlName="newProjectdistrict"
              optionLabel="name"
              placeholder="Select a District"
              (onChange)="getMandals($event)"
            />
          </div>
          <div class="formbuilder-select form-group field-select-1738522218203">
            <label for="select-1738522218203" class="formbuilder-select-label"
              >Mandal</label
            >
            <p-dropdown
              [filter]="true"
              [options]="mandals"
              formControlName="newProjectmandal"
              optionLabel="name"
              placeholder="Select a Mandal"
              (onChange)="getvilages($event)"
            />
          </div>
          <div class="formbuilder-select form-group field-select-1738522221098">
            <label for="select-1738522221098" class="formbuilder-select-label"
              >Village</label
            >
            <p-dropdown
              [filter]="true"
              [options]="vilage"
              formControlName="newProjectvillage"
              optionLabel="name"
              placeholder="Select a Village"
            />
          </div>

          <div class="formbuilder-select form-group field-select-1738522221098">
            <label for="select-1738522221098" class="formbuilder-select-label"
              >Colony/Street/Location</label
            >
            <input type="text" pInputText formControlName="newProjectAddress" />
          </div>
          <div class="formbuilder-select form-group field-select-1738522233201">
            <label for="select-1738522233201" class="formbuilder-select-label"
              >Project Category</label
            >
            <p-dropdown
              [filter]="true"
              [options]="newProjectDetails"
              formControlName="newProjectCategory"
              optionLabel="name"
              placeholder="Select Projects Category"
              (onChange)="getProjectNames($event)"
            />
          </div>
        </div>

        <div class="field">
          <label for="name">Project Name</label>
          <p-dropdown
            [filter]="true"
            [options]="newProjectListNames"
            formControlName="newProjectName"
            optionLabel="description"
            placeholder="Select Projects Name"
          />
          <small class="p-error" *ngIf="submitted && !product.name">
            Name is required.
          </small>
        </div>
        <div class="field">
          <label for="description">Project Description</label>
          <textarea
            pInputTextarea
            formControlName="newProjectDescription"
            required
            rows="3"
            cols="20"
          >
          </textarea>
        </div>

        <div class="formgrid grid">
          <div class="field col">
            <label for="price">Project Estimation</label>
            <p-inputNumber
              id="price"
              formControlName="newProjectEstimation"
              mode="currency"
              currency="USD"
              locale="en-US"
            />
          </div>
        </div>

        <div class="formgrid grid">
          <div class="field col">
            <label for="price">Govt Share</label>
            <p-inputNumber
              id="price"
              formControlName="newProjectGovtShare"
              mode="currency"
              currency="USD"
              locale="en-US"
            />
          </div>
        </div>

        <div class="formgrid grid">
          <div class="field col">
            <label for="price">Public Share</label>
            <p-inputNumber
              id="price"
              formControlName="newProjectPublicShare"
              mode="currency"
              currency="USD"
              locale="en-US"
            />
          </div>
        </div>

        <p-button
          label="Cancel"
          icon="pi pi-times"
          [text]="true"
          (onClick)="hideDialog()"
        />
        <p-button type="submit" label="Save" icon="pi pi-check" [text]="true" />
      </form>
    </ng-template>
  </p-dialog>

  <p-confirmDialog [style]="{ width: '100%' }" />
</div>
